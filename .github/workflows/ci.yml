name: CI & CD

on:
  pull_request:
  push:
    branches: [main, develop]

# Si llega un push nuevo a la misma rama/PR, cancela la ejecución anterior (ya quedó vieja).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio: este workflow solo puede LEER el código.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  docker:
    name: Build & Push Docker image
    # No corre si lint/typecheck/test/build no terminaron en verde antes.
    needs: [lint, typecheck, test, build]
    # Solo publicamos imagen en push a main o develop, nunca en cada PR.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Este es EL cambio clave para multi-environment: según qué rama disparó
    # el workflow, este job "entra" a un Environment distinto de GitHub
    # (production o staging). Eso decide de qué lugar salen los secretos
    # que use ${{ secrets.* }} más abajo, sin tocar el resto del YAML.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    # Este job necesita permiso extra: escribir en GitHub Container Registry.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Decide el tag de la imagen según la rama: main -> latest,
      # develop -> staging. Cada environment despliega SU propio tag.
      - name: Determine image tag
        id: vars
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=staging" >> "$GITHUB_OUTPUT"
          fi

      # Buildx es el motor de build de Docker de nueva generación:
      # habilita el cache remoto que usamos más abajo (cache-from/cache-to).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Login contra GHCR usando el token automático del workflow.
      # No hace falta crear ningún secreto propio.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Calcula los tags de la imagen a partir del contexto del repo.
      # "value" usa el tag que calculamos arriba (latest o staging), y
      # además siempre agregamos el hash corto del commit, para poder
      # volver atrás a una versión exacta si algo sale mal.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache de capas reutilizando el cache de GitHub Actions:
          # los builds siguientes son mucho más rápidos.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Solo se ejecuta si "Build and push" terminó bien (si un step falla,
      # los siguientes no corren, así nunca disparamos un deploy con una
      # imagen que no se llegó a publicar).
      # -f: falla si Render responde con error. -sS: sin barra de progreso,
      # pero sí muestra el error si algo sale mal.
      - name: Trigger deploy on Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
